# Development database for sqlkit.
#
# Codegen needs a live Postgres to answer Parse/Describe, and `sqlkit check`
# needs one in CI. Port 55432 is deliberate: it stays out of the way of any
# Postgres already on 5432.
#
#   docker compose up -d
#   DATABASE_URL=postgresql://sqlkit:sqlkit@127.0.0.1:55432/sqlkit dune exec bin/main.exe
#
# Schema in example/schema.sql is applied automatically on first boot. To
# re-apply after editing it: docker compose down -v && docker compose up -d

services:
  postgres:
    image: postgres:18
    container_name: sqlkit-pg
    environment:
      POSTGRES_USER: sqlkit
      POSTGRES_PASSWORD: sqlkit
      POSTGRES_DB: sqlkit
      # Deterministic output for the types we parse from text.
      PGTZ: UTC
    ports:
      - "55432:5432"
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory, so the volume
      # mounts at /var/lib/postgresql -- NOT .../data as in 17 and earlier.
      # Mounting .../data makes the image refuse to start.
      - pgdata:/var/lib/postgresql
      - ./example/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlkit -d sqlkit"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A second server for the pure OCaml driver's connection checks
  # (example/pgwire_checks.ml): TLS on and MD5 passwords instead of SCRAM. It
  # makes its own throwaway CA and a certificate for "localhost" on every start,
  # so no key is kept in the repository. No volume; it holds nothing.
  postgres-tls:
    image: postgres:18
    container_name: sqlkit-pg-tls
    environment:
      POSTGRES_USER: sqlkit
      POSTGRES_PASSWORD: sqlkit
      POSTGRES_DB: sqlkit
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        d=/var/lib/sqlkit-tls
        mkdir -p $$d && cd $$d
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -subj "/CN=sqlkit test CA" \
          -addext "basicConstraints=critical,CA:TRUE" \
          -addext "keyUsage=critical,keyCertSign,cRLSign" \
          -keyout ca.key -out ca.pem 2>/dev/null
        openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" \
          -keyout server.key -out server.csr 2>/dev/null
        printf 'subjectAltName=DNS:localhost\nbasicConstraints=CA:FALSE\n' > ext
        openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
          -days 3650 -extfile ext -out server.pem 2>/dev/null
        chown postgres:postgres server.key server.pem
        chmod 600 server.key
        exec docker-entrypoint.sh postgres -c ssl=on \
          -c ssl_cert_file=$$d/server.pem -c ssl_key_file=$$d/server.key
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlkit -d sqlkit"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
